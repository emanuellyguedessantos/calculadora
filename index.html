<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSimulador Agrinho 2026</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Agro Forte, Futuro Sustentável</h1>
        <p class="subtitulo">Simulador de Equilíbrio: Produção vs Meio Ambiente</p>

        <!-- Seção de Inputs/Perguntas -->
        <div class="formulario">
            <div class="campo">
                <label for="producao">Tamanho da sua colheita anual (em toneladas):</label>
                <input type="number" id="producao" placeholder="Ex: 50">
            </div>

            <div class="campo">
                <label for="tecnologia">Qual tecnologia sustentável você usa?</label>
                <select id="tecnologia">
                    <option value="nenhuma">Nenhuma / Tradicional</option>
                    <option value="direto">Plantio Direto na Palha</option>
                    <option value="solar">Energia Solar / Irrigação Gota a Gota</option>
                    <option value="rotacao">Rotação de Culturas e ILPF</option>
                </select>
            </div>

            <div class="campo">
                <label for="arvores">Quantas árvores nativas você plantou ou preservou?</label>
                <input type="number" id="arvores" placeholder="Ex: 100">
            </div>

            <button onclick="calcularImpacto()">Simular Sustentabilidade</button>
        </div>

        <!-- Painel de Resultados (Escondido no início) -->
        <div id="resultado" class="resultado Oculto">
            <h2>Balanço da sua Fazenda</h2>
            <div class="metricas">
                <p><strong>Pontuação Ambiental:</strong> <span id="pontos-eco">0</span>/100</p>
                <p><strong>Status:</strong> <span id="status-fazenda">-</span></p>
            </div>
            <p id="feedback-texto"></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
